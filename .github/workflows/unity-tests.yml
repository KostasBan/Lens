name: Unity EditMode Tests

on:
  workflow_dispatch:

jobs:
  editmode-tests:
    name: Unity 6000.3 EditMode tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare package test directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir test-package
          rsync -a \
            --exclude='.git' \
            --exclude='test-package' \
            ./ test-package/

      - name: Run EditMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          packageMode: true
          projectPath: test-package
          unityVersion: 6000.3.16f1
          testMode: editmode
          artifactsPath: editmode-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity EditMode Test Results

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
